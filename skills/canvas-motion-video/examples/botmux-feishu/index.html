<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BotMux × 飞书 × AI</title>
<style>html,body{margin:0;padding:0;background:#F7F8FC;overflow:hidden}canvas{display:block;width:1920px;height:1080px}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080, SAFE = 110, TOTAL = 1200;
const C = {
  bg: '#F7F8FC', text: '#1F2329', sub: '#646A73', mute: '#A2A8B3',
  blue: '#3370FF', cyan: '#00C2FF', violet: '#7B61FF', pink: '#FF6B9A', yellow: '#FFC53D',
  white: '#FFFFFF', skel: 'rgba(31,35,41,0.08)'
};
const SANS = '"Noto Sans CJK SC", "PingFang SC", sans-serif';
const MONO = '"JetBrains Mono", Menlo, monospace';

// ---------- pure helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
const easeInCubic = t => Math.pow(clamp(t), 3);
const easeInOut = t => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const fade = (f, s, d = 12) => easeOutCubic((f - s) / d);
const out = (f, s, d = 10) => 1 - clamp((f - s) / d);
// deterministic damped spring (gentle overshoot ~9%)
function springT(t) { if (t <= 0) return 0; if (t >= 2) return 1; return 1 - Math.exp(-6 * t) * Math.cos(8 * t); }
const sp = (f, s, d = 20) => springT((f - s) / d);
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }

let TEXT_LOG = [];
function trackOf(size, o) { if (o.mono) return '0px'; return size >= 44 ? `${(-size * 0.02).toFixed(2)}px` : '0px'; }
function brandGrad(ctx, x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, C.blue); g.addColorStop(0.5, C.violet); g.addColorStop(1, C.pink);
  return g;
}
function lin2(ctx, x0, y0, x1, y1, a, b) { const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function text(ctx, s, x, y, o) {
  const size = o.size || 32, weight = o.weight || 400;
  ctx.font = `${weight} ${size}px ${o.mono ? MONO : SANS}`;
  ctx.letterSpacing = trackOf(size, o);
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'alphabetic';
  const m = ctx.measureText(s);
  if (o.grad) {
    const al = o.align || 'left';
    const xl = al === 'center' ? x - m.width / 2 : al === 'right' ? x - m.width : x;
    ctx.fillStyle = brandGrad(ctx, xl, 0, xl + m.width, 0);
  } else ctx.fillStyle = o.color || C.text;
  ctx.fillText(s, x, y);
  ctx.letterSpacing = '0px';
  const a = ctx.globalAlpha;
  if (a > 0.02) {
    const t = ctx.getTransform();
    const x0 = x - m.actualBoundingBoxLeft, x1 = x + m.actualBoundingBoxRight;
    const y0 = y - m.actualBoundingBoxAscent, y1 = y + m.actualBoundingBoxDescent;
    const pts = [[x0, y0], [x1, y0], [x0, y1], [x1, y1]].map(([px, py]) => [t.a * px + t.c * py + t.e, t.b * px + t.d * py + t.f]);
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    TEXT_LOG.push({ s, g: o.g || null, alpha: +a.toFixed(3), x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) });
  }
  return m.width;
}
function measure(ctx, s, o) {
  const size = o.size || 32;
  ctx.font = `${o.weight || 400} ${size}px ${o.mono ? MONO : SANS}`;
  ctx.letterSpacing = trackOf(size, o);
  const w = ctx.measureText(s).width;
  ctx.letterSpacing = '0px';
  return w;
}
function rrect(ctx, x, y, w, h, r) { const m = Math.max(0, Math.min(w / 2, h / 2)); ctx.beginPath(); ctx.roundRect(x, y, w, Math.max(0, h), Array.isArray(r) ? r.map(v => Math.min(v, m)) : Math.max(0, Math.min(r, m))); }
function withAlpha(ctx, a, fn) { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= Math.min(1, a); fn(); ctx.restore(); }
function at(ctx, x, y, s, fn, rot = 0) { ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(s, s); ctx.translate(-x, -y); fn(); ctx.restore(); }

// kinetic typography: per-segment spring rise + stagger + optional highlight sweep
function kinetic(ctx, segs, cx, y, o, f, start, stagger, gid) {
  const ws = segs.map(sg => measure(ctx, sg.s, o));
  const total = ws.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  segs.forEach((sg, i) => {
    const st = start + i * stagger;
    const p = sp(f, st, 18), a = fade(f, st, 10);
    const xi = x, wi = ws[i];
    withAlpha(ctx, a, () => {
      const dy = (1 - p) * 46;
      if (sg.hl) {
        const hp = easeOutCubic((f - st - 10) / 18);
        const core = sg.s.replace(/[，。、！？]+$/, '');
        const hw = measure(ctx, core, o);
        if (hp > 0) { ctx.save(); ctx.globalAlpha *= 0.22; ctx.fillStyle = brandGrad(ctx, xi, 0, xi + hw, 0); rrect(ctx, xi - 6, y - o.size * 0.30 + dy, (hw + 12) * hp, o.size * 0.40, 10); ctx.fill(); ctx.restore(); }
      }
      text(ctx, sg.s, xi, y + dy, Object.assign({}, o, { align: 'left', grad: sg.grad, g: gid }));
    });
    x += wi;
  });
}

// ---------- drawing primitives ----------
function card(ctx, x, y, w, h, r, o = {}) {
  ctx.save();
  ctx.shadowColor = o.shadow || 'rgba(51,112,255,0.16)'; ctx.shadowBlur = o.blur == null ? 44 : o.blur; ctx.shadowOffsetY = o.oy == null ? 18 : o.oy;
  rrect(ctx, x, y, w, h, r); ctx.fillStyle = o.fill || 'rgba(255,255,255,0.94)'; ctx.fill();
  ctx.restore();
  ctx.save(); rrect(ctx, x, y, w, h, r); ctx.strokeStyle = o.stroke || 'rgba(31,35,41,0.06)'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
}
function skelBar(ctx, x, y, w, h, fill) { rrect(ctx, x, y, w, h, h / 2); ctx.fillStyle = fill || C.skel; ctx.fill(); }
function bubbleSize(ctx, s, size) { const padX = size * 0.9, padY = size * 0.72; return { w: measure(ctx, s, { size, weight: 500 }) + padX * 2, h: size + padY * 2, padX }; }
// user bubble (right aligned, blue) or bot bubble (left, white). x = right edge for 'right', left edge for 'left'; y = top
function bubble(ctx, s, x, y, o) {
  const size = o.size || 26; const b = bubbleSize(ctx, s, size);
  const bx = o.side === 'right' ? x - b.w : x;
  if (o.side === 'right') {
    ctx.save(); ctx.shadowColor = 'rgba(51,112,255,0.28)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
    rrect(ctx, bx, y, b.w, b.h, b.h / 2); ctx.fillStyle = lin2(ctx, bx, y, bx + b.w, y + b.h, '#3370FF', '#5E7BFF'); ctx.fill(); ctx.restore();
    text(ctx, s, bx + b.padX, y + b.h / 2 + size * 0.36, { size, weight: 500, color: '#FFFFFF', g: o.g });
  } else {
    card(ctx, bx, y, b.w, b.h, b.h / 2, { blur: 18, oy: 6, shadow: 'rgba(31,35,41,0.08)' });
    text(ctx, s, bx + b.padX, y + b.h / 2 + size * 0.36, { size, weight: 500, color: C.text, g: o.g });
  }
  return { x: bx, y, w: b.w, h: b.h };
}
function bezPt(P, t) {
  const u = 1 - t;
  return [u * u * u * P[0][0] + 3 * u * u * t * P[1][0] + 3 * u * t * t * P[2][0] + t * t * t * P[3][0],
          u * u * u * P[0][1] + 3 * u * u * t * P[1][1] + 3 * u * t * t * P[2][1] + t * t * t * P[3][1]];
}
function glowDot(ctx, x, y, color, r) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.4);
  g.addColorStop(0, hexA(color, 0.55)); g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, Math.PI * 2); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke();
}
// animated connection: draws on with prog, flowing dashes, light pulses travelling along
function flow(ctx, P, color, prog, f, o = {}) {
  if (prog <= 0.001) return;
  const N = 48, n = Math.max(2, Math.ceil(N * prog));
  ctx.save(); ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= n; i++) { const p = bezPt(P, prog * i / n); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
  ctx.strokeStyle = hexA(color, 0.18); ctx.lineWidth = (o.w || 3) + 3; ctx.stroke();
  ctx.setLineDash([3, 13]); ctx.lineDashOffset = -f * (o.rev ? -1.4 : 1.4);
  ctx.strokeStyle = hexA(color, 0.9); ctx.lineWidth = o.w || 3; ctx.stroke();
  ctx.restore();
  if (prog >= 0.999 && o.pulses !== 0) {
    const k = o.pulses || 2;
    for (let j = 0; j < k; j++) {
      let t = ((f * (o.ps || 0.014)) + j / k + (o.ph || 0)) % 1; if (o.rev) t = 1 - t;
      const p = bezPt(P, t);
      const ea = Math.sin(Math.PI * t);
      withAlpha(ctx, ea, () => glowDot(ctx, p[0], p[1], color, o.pr || 8));
    }
  }
}
function ring(ctx, x, y, r, a, w, color) {
  if (a <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = color || brandGrad(ctx, x - r, y - r, x + r, y + r); ctx.lineWidth = w; ctx.stroke(); ctx.restore();
}
// ---------- icons & devices ----------
function feishuIcon(ctx, x, y, s) { // stylized app tile (not a trademark): rounded square + chat glyph
  ctx.save();
  ctx.shadowColor = 'rgba(51,112,255,0.35)'; ctx.shadowBlur = s * 0.4; ctx.shadowOffsetY = s * 0.12;
  rrect(ctx, x - s / 2, y - s / 2, s, s, s * 0.26); ctx.fillStyle = lin2(ctx, x - s / 2, y - s / 2, x + s / 2, y + s / 2, C.blue, C.cyan); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.fillStyle = '#FFFFFF';
  const bw = s * 0.48, bh = s * 0.34;
  rrect(ctx, x - bw / 2, y - bh / 2 - s * 0.04, bw, bh, s * 0.1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - bw * 0.18, y + bh / 2 - s * 0.06); ctx.lineTo(x - bw * 0.3, y + bh / 2 + s * 0.12); ctx.lineTo(x + bw * 0.06, y + bh / 2 - s * 0.06); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.blue;
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(x + i * s * 0.11, y - s * 0.04, s * 0.035, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
function miniHub(ctx, x, y, r, f) {
  ctx.save();
  ctx.shadowColor = 'rgba(123,97,255,0.4)'; ctx.shadowBlur = r * 0.8;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = brandGrad(ctx, x - r, y - r, x + r, y + r); ctx.fill();
  ctx.restore();
  muxGlyph(ctx, x, y, r * 0.95);
}
function muxGlyph(ctx, x, y, r) { // three inputs merging into one output
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.fillStyle = '#FFFFFF'; ctx.lineWidth = Math.max(1.5, r * 0.09); ctx.lineCap = 'round';
  const lx = x - r * 0.45, rx = x + r * 0.42;
  for (let i = -1; i <= 1; i++) {
    const ly = y + i * r * 0.34;
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.bezierCurveTo(x - r * 0.05, ly, x - r * 0.05, y, rx - r * 0.1, y); ctx.stroke();
    ctx.beginPath(); ctx.arc(lx, ly, r * 0.09, 0, Math.PI * 2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(rx, y, r * 0.14, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function sparkle(ctx, x, y, r, color) {
  ctx.save(); ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x + r * 0.15, y - r * 0.15, x + r, y); ctx.quadraticCurveTo(x + r * 0.15, y + r * 0.15, x, y + r);
  ctx.quadraticCurveTo(x - r * 0.15, y + r * 0.15, x - r, y); ctx.quadraticCurveTo(x - r * 0.15, y - r * 0.15, x, y - r); ctx.fill(); ctx.restore();
}
function botAvatar(ctx, x, y, r, color) {
  ctx.save(); ctx.shadowColor = hexA(color, 0.35); ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = lin2(ctx, x - r, y - r, x + r, y + r, color, '#FFFFFF'); ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = hexA(color, 0.9); ctx.fill();
  sparkle(ctx, x, y, r * 0.55, '#FFFFFF');
}
function userAvatar(ctx, x, y, r, c1, c2) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = lin2(ctx, x - r, y - r, x + r, y + r, c1, c2); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y - r * 0.18, r * 0.32, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.5, r * 0.5, r * 0.3, 0, Math.PI, 0); ctx.fill();
}
function typingDots(ctx, x, y, f, color) {
  for (let i = 0; i < 3; i++) {
    const b = Math.sin(f * 0.25 - i * 0.8);
    ctx.beginPath(); ctx.arc(x + i * 18, y - Math.max(0, b) * 6, 5, 0, Math.PI * 2);
    ctx.fillStyle = hexA(color || C.violet, 0.45 + 0.4 * Math.max(0, b)); ctx.fill();
  }
}
function outIcon(ctx, kind, x, y, s, color) { // 文档 / 表格 / 演示 / 自动化 glyphs (white on color)
  ctx.save(); ctx.strokeStyle = '#FFFFFF'; ctx.fillStyle = '#FFFFFF'; ctx.lineWidth = Math.max(2, s * 0.09); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'doc') { rrect(ctx, x - s * 0.3, y - s * 0.38, s * 0.6, s * 0.76, s * 0.08); ctx.stroke(); for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x - s * 0.16, y - s * 0.14 + i * s * 0.16); ctx.lineTo(x + s * (i === 2 ? 0.04 : 0.16), y - s * 0.14 + i * s * 0.16); ctx.stroke(); } }
  else if (kind === 'sheet') { rrect(ctx, x - s * 0.36, y - s * 0.32, s * 0.72, s * 0.64, s * 0.08); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - s * 0.36, y - s * 0.08); ctx.lineTo(x + s * 0.36, y - s * 0.08); ctx.moveTo(x - s * 0.36, y + s * 0.12); ctx.lineTo(x + s * 0.36, y + s * 0.12); ctx.moveTo(x - s * 0.08, y - s * 0.32); ctx.lineTo(x - s * 0.08, y + s * 0.32); ctx.stroke(); }
  else if (kind === 'slide') { rrect(ctx, x - s * 0.38, y - s * 0.3, s * 0.76, s * 0.5, s * 0.06); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y + s * 0.2); ctx.lineTo(x, y + s * 0.36); ctx.moveTo(x - s * 0.14, y + s * 0.36); ctx.lineTo(x + s * 0.14, y + s * 0.36); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - s * 0.06, y - s * 0.14); ctx.lineTo(x + s * 0.1, y - s * 0.05); ctx.lineTo(x - s * 0.06, y + s * 0.04); ctx.closePath(); ctx.fill(); }
  else if (kind === 'auto') { ctx.beginPath(); ctx.moveTo(x + s * 0.06, y - s * 0.4); ctx.lineTo(x - s * 0.2, y + s * 0.04); ctx.lineTo(x + s * 0.02, y + s * 0.04); ctx.lineTo(x - s * 0.06, y + s * 0.4); ctx.lineTo(x + s * 0.22, y - s * 0.06); ctx.lineTo(x, y - s * 0.06); ctx.closePath(); ctx.fill(); }
  else if (kind === 'ai') { sparkle(ctx, x, y, s * 0.38, '#FFFFFF'); }
  else if (kind === 'cli') { ctx.beginPath(); ctx.moveTo(x - s * 0.28, y - s * 0.18); ctx.lineTo(x - s * 0.06, y); ctx.lineTo(x - s * 0.28, y + s * 0.18); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + s * 0.02, y + s * 0.2); ctx.lineTo(x + s * 0.28, y + s * 0.2); ctx.stroke(); }
  else if (kind === 'skill') { for (let i = 0; i < 4; i++) { const dx = (i % 2 ? 1 : -1) * s * 0.15, dy = (i < 2 ? -1 : 1) * s * 0.15; rrect(ctx, x + dx - s * 0.11, y + dy - s * 0.11, s * 0.22, s * 0.22, s * 0.06); ctx.fill(); } }
  ctx.restore();
}
function iconTile(ctx, kind, x, y, s, color) {
  ctx.save(); ctx.shadowColor = hexA(color, 0.4); ctx.shadowBlur = s * 0.5; ctx.shadowOffsetY = s * 0.12;
  rrect(ctx, x - s / 2, y - s / 2, s, s, s * 0.3); ctx.fillStyle = lin2(ctx, x - s / 2, y - s / 2, x + s / 2, y + s / 2, color, hexA(color, 0.75)); ctx.fill(); ctx.restore();
  outIcon(ctx, kind, x, y, s * 0.8, color);
}
// pill with icon tile + label; (x,y) = centre
function pill(ctx, kind, label, x, y, color, o = {}) {
  const size = o.size || 32, mono = !!o.mono;
  const tw = measure(ctx, label, { size, weight: 700, mono });
  const h = o.h || 84, tile = h - 24, w = tw + tile + 60;
  card(ctx, x - w / 2, y - h / 2, w, h, h / 2, { shadow: hexA(color, 0.22), blur: 34, oy: 12 });
  iconTile(ctx, kind, x - w / 2 + 12 + tile / 2, y, tile, color);
  text(ctx, label, x - w / 2 + 12 + tile + 18, y + size * 0.36, { size, weight: 700, color: C.text, mono, g: o.g });
  return w;
}
// Feishu-style chat window (light). returns body rect
function feishuWindow(ctx, x, y, w, h, o = {}) {
  card(ctx, x, y, w, h, 28, { shadow: 'rgba(51,112,255,0.18)', blur: 70, oy: 28 });
  ctx.save(); rrect(ctx, x, y, w, h, 28); ctx.clip();
  ctx.fillStyle = 'rgba(245,247,252,0.9)'; ctx.fillRect(x, y, w, 68);
  ctx.fillStyle = 'rgba(31,35,41,0.06)'; ctx.fillRect(x, y + 68, w, 1);
  if (o.sidebar) { ctx.fillStyle = 'rgba(51,112,255,0.04)'; ctx.fillRect(x, y + 69, 84, h - 69); for (let i = 0; i < 4; i++) { rrect(ctx, x + 22, y + 96 + i * 64, 40, 40, 12); ctx.fillStyle = i === 0 ? hexA(C.blue, 0.18) : 'rgba(31,35,41,0.06)'; ctx.fill(); } }
  ctx.restore();
  feishuIcon(ctx, x + 44, y + 34, 36);
  text(ctx, '飞书', x + 74, y + 43, { size: 24, weight: 700, color: C.text, g: o.g });
  // window dots right
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + w - 36 - i * 22, y + 34, 6, 0, Math.PI * 2); ctx.fillStyle = ['#FF6B9A', '#FFC53D', '#00C2FF'][i]; ctx.globalAlpha *= 0.7; ctx.fill(); ctx.globalAlpha /= 0.7; }
}
function phone(ctx, x, y, w, h) { // x,y top-left
  ctx.save(); ctx.shadowColor = 'rgba(51,112,255,0.22)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 26;
  rrect(ctx, x, y, w, h, 56); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.restore();
  rrect(ctx, x, y, w, h, 56); ctx.strokeStyle = 'rgba(31,35,41,0.10)'; ctx.lineWidth = 2; ctx.stroke();
  rrect(ctx, x + 12, y + 12, w - 24, h - 24, 46); ctx.fillStyle = '#F6F7FB'; ctx.fill();
  rrect(ctx, x + w / 2 - 54, y + 26, 108, 30, 15); ctx.fillStyle = '#1F2329'; ctx.fill();
}

// ---------- BotMux hub (hero) ----------
const HUBK = [
  [166, 960, 640, 110], [390, 960, 640, 110], [416, 960, 620, 84], [700, 960, 620, 84],
  [734, 960, 640, 130], [826, 960, 640, 130], [852, 960, 640, 178], [874, 960, 640, 140],
  [948, 960, 640, 140], [982, 1180, 600, 46], [1088, 1180, 600, 46], [1116, 626, 428, 26], [1200, 626, 428, 26]
];
function hubState(f) {
  if (f <= HUBK[0][0]) return { x: HUBK[0][1], y: HUBK[0][2], r: HUBK[0][3] };
  for (let i = 0; i < HUBK.length - 1; i++) {
    const a = HUBK[i], b = HUBK[i + 1];
    if (f >= a[0] && f < b[0]) {
      const t = (f - a[0]) / (b[0] - a[0]);
      const e = easeInOut(t), s = springT(t * 1.6);
      return { x: lerp(a[1], b[1], e), y: lerp(a[2], b[2], e), r: lerp(a[3], b[3], s) };
    }
  }
  const z = HUBK[HUBK.length - 1]; return { x: z[1], y: z[2], r: z[3] };
}

const NODES = [

function nodeState(i, f) {

    });

      const x = lerp(hb.x, O.x, p), y = lerp(hb.y, O.y, p) + Math.sin(f * 0.05 + i * 1.7) * 6;
      const a = clamp((p - 0.45) / 0.3);
      withAlpha(ctx, a, () => at(ctx, x, y, 0.4 + 0.6 * Math.min(1.1, p), () => pill(ctx, O.kind, O.s, x, y, O.color, { size: 34, h: 88 })));

// ================= S5 958–1096 : 换个地方，事情接着办 =================

    withAlpha(ctx, fade(f, 1002, 12) * clamp(1 - conv * 2.4), () => at(ctx, lerp(PH[0] + PH[2] / 2, 960, conv), 600, lerp(1, 0.6, conv), () => {

      const [x, y, w, h] = PH;

      feishuIcon(ctx, x + 48, y + 100, 30);
      text(ctx, '飞书', x + 72, y + 108, { size: 20, weight: 700, color: C.text });
      bubble(ctx, '第二页再精简一点。', x + w - 24, y + 150, { side: 'right', size: 20 });
      const m2 = sp(f, 1022, 16);
      withAlpha(ctx, fade(f, 1022, 8), () => at(ctx, x + w - 24, y + 236, Math.max(0.01, m2), () => bubble(ctx, '好了，发我看看。', x + w - 24, y + 214, { side: 'right', size: 20 })));
      const rp = sp(f, 1062, 20);
      withAlpha(ctx, fade(f, 1062, 8), () => at(ctx, x + 40, y + 340, Math.max(0.01, rp), () => {
        miniHub(ctx, x + 40, y + 310, 16, f);
        card(ctx, x + 64, y + 290, 240, 130, 18, { shadow: 'rgba(123,97,255,0.2)', blur: 24, oy: 8 });
        text(ctx, '结果', x + 84, y + 322, { size: 18, weight: 700, grad: true });
        for (let i = 0; i < 3; i++) { rrect(ctx, x + 84 + i * 70, y + 340, 60, 62, 8); ctx.fillStyle = hexA([C.blue, C.violet, C.pink][i], 0.18); ctx.fill(); }

      flow(ctx, [[1090, 520], [1130, 520], [1140, 600], [hb.x - hb.r, 600]], C.blue, easeOutCubic((f - 1008) / 16), f, { pulses: 1, ps: 0.02, rev: true });
      flow(ctx, [[hb.x + hb.r, 600], [1240, 600], [1250, 520], [1290, 520]], C.violet, easeOutCubic((f - 1012) / 16), f, { pulses: 1, ps: 0.02, rev: true, ph: 0.5 });

// ================= frame assembly =================
const SCENES = [s1, s2, s3, s4, s5, s6];
function renderFrame(ctx, frame) {
  const f = Math.max(0, Math.min(TOTAL - 1, Math.round(frame)));
  TEXT_LOG = [];
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const cam = camera(f);
  drawBackground(ctx, f, cam);
  ctx.translate(W / 2 + cam.dx, H / 2 + cam.dy); ctx.scale(cam.s, cam.s); ctx.translate(-W / 2, -H / 2);
  for (const s of SCENES) s(ctx, f, 'back');
  drawHub(ctx, f);
  for (const s of SCENES) s(ctx, f, 'front');
  ctx.restore();
  if (f >= TOTAL - 8) {
    const a = clamp((f - (TOTAL - 9)) / 8);
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); ctx.restore();
    TEXT_LOG.forEach(t => { t.alpha = +(t.alpha * (1 - a)).toFixed(3); });
  }
}
const canvas = document.getElementById('c');
const ctx2d = canvas.getContext('2d');
window.TOTAL = TOTAL;
window.render = (frame) => { renderFrame(ctx2d, frame); return TEXT_LOG.filter(t => t.alpha > 0.02); };
window.FONT_SPECS = [`400 36px "Noto Sans CJK SC"`, `700 64px "Noto Sans CJK SC"`, `400 28px "JetBrains Mono"`, `700 28px "JetBrains Mono"`];

renderFrame(ctx2d, q.has('f') ? +q.get('f') : 0);
